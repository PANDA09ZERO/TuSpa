<div id="sub-g0" class="cap clip" data-start="1.21" data-duration="3.02"><span>Bienvenida a tuSpa, el sistema de gestión para tu spa.</span></div>
<div id="sub-g1" class="cap clip" data-start="4.6" data-duration="2.98"><span>En este video aprenderás a ingresar, a usar cada módulo,</span></div>
<div id="sub-g2" class="cap clip" data-start="7.6" data-duration="4.07"><span>a llevarlo en tu celular y qué puede hacer cada tipo de usuario.</span></div>
<div id="sub-g3" class="cap clip" data-start="12.98" data-duration="2.32"><span>Abre la dirección del sistema en tu navegador.</span></div>
<div id="sub-g4" class="cap clip" data-start="15.66" data-duration="2.64"><span>Escribe el email y la contraseña que te dio el Administrador,</span></div>
<div id="sub-g5" class="cap clip" data-start="18.32" data-duration="2.65"><span>y pulsa Iniciar sesión.</span></div>
<div id="sub-g6" class="cap clip" data-start="21.38" data-duration="4.06"><span>Si algún dato está mal, verás el aviso: Email o contraseña incorrectos.</span></div>
<div id="sub-g7" class="cap clip" data-start="25.82" data-duration="3.21"><span>Revísalo e inténtalo otra vez.</span></div>
<div id="sub-g8" class="cap clip" data-start="29.44" data-duration="5.2"><span>Para salir del sistema, usa el ícono de cerrar sesión, arriba a la derecha.</span></div>
<div id="sub-g9" class="cap clip" data-start="35.95" data-duration="2.31"><span>En la computadora, el menú está a la izquierda:</span></div>
<div id="sub-g10" class="cap clip" data-start="38.28" data-duration="3.07"><span>arriba tu espacio de trabajo, y abajo la administración.</span></div>
<div id="sub-g11" class="cap clip" data-start="41.71" data-duration="3.91"><span>Ver página pública te muestra lo que ven tus clientas.</span></div>
<div id="sub-g12" class="cap clip" data-start="46.03" data-duration="3.84"><span>Arriba ves tu nombre y tu rol. El Resumen te dice cómo va tu día:</span></div>
<div id="sub-g13" class="cap clip" data-start="49.89" data-duration="5.28"><span>las citas de hoy, tus clientes, los servicios activos y los ingresos del mes.</span></div>
<div id="sub-g14" class="cap clip" data-start="55.57" data-duration="2.14"><span>Más abajo están tus próximas citas con su estado,</span></div>
<div id="sub-g15" class="cap clip" data-start="57.73" data-duration="3.38"><span>y los accesos directos a lo que más usas.</span></div>
<div id="sub-g16" class="cap clip" data-start="62.42" data-duration="3.58"><span>En la Agenda de citas ves los contadores del período y el calendario del mes.</span></div>
<div id="sub-g17" class="cap clip" data-start="66.37" data-duration="3.12"><span>El día de hoy aparece remarcado.</span></div>
<div id="sub-g18" class="cap clip" data-start="69.9" data-duration="3.89"><span>Cada punto es una cita, y su color indica el estado: verde, confirmada;</span></div>
<div id="sub-g19" class="cap clip" data-start="73.81" data-duration="2.78"><span>amarillo, pendiente; azul, en curso.</span></div>
<div id="sub-g20" class="cap clip" data-start="76.95" data-duration="4.1"><span>Pasa el cursor para ver la hora, la clienta y el servicio.</span></div>
<div id="sub-g21" class="cap clip" data-start="81.47" data-duration="3.16"><span>Toca un día para ver a todas las clientas agendadas, con su horario,</span></div>
<div id="sub-g22" class="cap clip" data-start="84.65" data-duration="2.91"><span>sus servicios y quién las atiende.</span></div>
<div id="sub-g23" class="cap clip" data-start="87.97" data-duration="2.08"><span>Al elegir una cita ves todo su detalle:</span></div>
<div id="sub-g24" class="cap clip" data-start="90.07" data-duration="5.5"><span>la clienta, los servicios, la especialista, el horario y las observaciones.</span></div>
<div id="sub-g25" class="cap clip" data-start="95.98" data-duration="2.03"><span>Para agendar, pulsa Nueva cita.</span></div>
<div id="sub-g26" class="cap clip" data-start="98.37" data-duration="3.65"><span>Busca a la clienta por su nombre o su teléfono, o regístrala ahí mismo.</span></div>
<div id="sub-g27" class="cap clip" data-start="102.39" data-duration="5.18"><span>Agrega uno o varios servicios, y el sistema calcula la duración y el total.</span></div>
<div id="sub-g28" class="cap clip" data-start="107.98" data-duration="3.62"><span>Elige a la especialista, la fecha y la hora, siempre en horario de Perú,</span></div>
<div id="sub-g29" class="cap clip" data-start="111.62" data-duration="2.31"><span>y guarda la cita.</span></div>
<div id="sub-g30" class="cap clip" data-start="114.33" data-duration="3.52"><span>Con Editar cita puedes cambiar la clienta, los servicios, la especialista,</span></div>
<div id="sub-g31" class="cap clip" data-start="117.87" data-duration="2.61"><span>la fecha o la hora. También su estado:</span></div>
<div id="sub-g32" class="cap clip" data-start="120.5" data-duration="3.93"><span>confírmala, márcala en curso, o cancélala.</span></div>
<div id="sub-g33" class="cap clip" data-start="124.84" data-duration="5.01"><span>Si atendiste a una invitada, regístrala como clienta desde su misma cita.</span></div>
<div id="sub-g34" class="cap clip" data-start="130.26" data-duration="2.06"><span>Filtra tus citas por día y por estado.</span></div>
<div id="sub-g35" class="cap clip" data-start="132.69" data-duration="4.91"><span>Y desde Citas del período, el botón Pagar cita te lleva directo a la caja.</span></div>
<div id="sub-g36" class="cap clip" data-start="138.91" data-duration="4.96"><span>En Clientes buscas a cualquier persona por su nombre, su teléfono o su email.</span></div>
<div id="sub-g37" class="cap clip" data-start="144.28" data-duration="3.64"><span>Con Nuevo cliente registras sus datos de contacto.</span></div>
<div id="sub-g38" class="cap clip" data-start="148.33" data-duration="4.67"><span>Con el lápiz corriges sus datos, por ejemplo, un teléfono nuevo.</span></div>
<div id="sub-g39" class="cap clip" data-start="153.42" data-duration="2.66"><span>El Administrador también puede eliminar a una clienta.</span></div>
<div id="sub-g40" class="cap clip" data-start="156.45" data-duration="5.05"><span>Si ya tiene citas o pagos, el sistema la protege para no perder su historial.</span></div>
<div id="sub-g41" class="cap clip" data-start="162.81" data-duration="4.63"><span>El catálogo empieza por las categorías, que agrupan tus servicios.</span></div>
<div id="sub-g42" class="cap clip" data-start="167.85" data-duration="2.14"><span>Luego vienen los servicios, con su precio,</span></div>
<div id="sub-g43" class="cap clip" data-start="170.01" data-duration="6.02"><span>su duración y una imagen de referencia. Si desactivas uno, deja de ofrecerse.</span></div>
<div id="sub-g44" class="cap clip" data-start="176.43" data-duration="3.02"><span>Las promociones tienen un porcentaje de descuento y fechas de vigencia,</span></div>
<div id="sub-g45" class="cap clip" data-start="179.47" data-duration="5.47"><span>y se aplican al cobrar. Solo el Administrador puede modificar el catálogo.</span></div>
<div id="sub-g46" class="cap clip" data-start="185.36" data-duration="2.55"><span>En Equipo, todos ven quién trabaja en el spa.</span></div>
<div id="sub-g47" class="cap clip" data-start="188.28" data-duration="1.69"><span>El Administrador crea las cuentas,</span></div>
<div id="sub-g48" class="cap clip" data-start="189.99" data-duration="4.15"><span>asigna el rol de cada persona y puede cambiar su contraseña.</span></div>
<div id="sub-g49" class="cap clip" data-start="195.45" data-duration="4.23"><span>La Caja muestra el día que elijas, con sus ingresos, sus egresos y el balance.</span></div>
<div id="sub-g50" class="cap clip" data-start="200.04" data-duration="3.28"><span>La usan el Administrador y Recepción.</span></div>
<div id="sub-g51" class="cap clip" data-start="203.73" data-duration="5.23"><span>Para cobrar, elige la cita. Verás su subtotal y el servicio.</span></div>
<div id="sub-g52" class="cap clip" data-start="209.36" data-duration="5.27"><span>Si llevó algo extra, agrégalo en Adicionales, con su concepto y su monto.</span></div>
<div id="sub-g53" class="cap clip" data-start="215.05" data-duration="3.99"><span>Aplica una promoción vigente o un descuento manual, en soles o en porcentaje.</span></div>
<div id="sub-g54" class="cap clip" data-start="219.41" data-duration="4.28"><span>El descuento solo afecta el precio de la cita. Luego elige el método de pago:</span></div>
<div id="sub-g55" class="cap clip" data-start="223.71" data-duration="4.46"><span>efectivo, Yape, Plin, tarjeta o transferencia.</span></div>
<div id="sub-g56" class="cap clip" data-start="228.58" data-duration="2.68"><span>Al registrar el pago, el ingreso entra solo a la caja,</span></div>
<div id="sub-g57" class="cap clip" data-start="231.28" data-duration="2.96"><span>y la cita queda como completada.</span></div>
<div id="sub-g58" class="cap clip" data-start="234.65" data-duration="3.74"><span>Los gastos del día se anotan en Registrar egreso.</span></div>
<div id="sub-g59" class="cap clip" data-start="238.79" data-duration="2.58"><span>En Movimientos del día ves los totales por método.</span></div>
<div id="sub-g60" class="cap clip" data-start="241.73" data-duration="5.21"><span>Toca un cobro para ver su detalle: adicionales, descuento y total pagado.</span></div>
<div id="sub-g61" class="cap clip" data-start="247.36" data-duration="2.22"><span>Al terminar el día, haz el cierre de caja:</span></div>
<div id="sub-g62" class="cap clip" data-start="249.6" data-duration="4.55"><span>cuenta el efectivo, y el sistema te muestra la diferencia con lo esperado.</span></div>
<div id="sub-g63" class="cap clip" data-start="254.55" data-duration="3.18"><span>Revisa los cierres de los últimos treinta días y, si hubo un error,</span></div>
<div id="sub-g64" class="cap clip" data-start="257.75" data-duration="2.87"><span>reabre la caja para corregirlo.</span></div>
<div id="sub-g65" class="cap clip" data-start="261.93" data-duration="1.94"><span>En Reportes ves cómo le va a tu negocio:</span></div>
<div id="sub-g66" class="cap clip" data-start="263.89" data-duration="1.8"><span>los ingresos del mes, las citas,</span></div>
<div id="sub-g67" class="cap clip" data-start="265.71" data-duration="3.63"><span>el promedio diario y los servicios más pedidos.</span></div>
<div id="sub-g68" class="cap clip" data-start="270.65" data-duration="2.92"><span>Esta es tu vitrina digital: la página que ven tus clientas,</span></div>
<div id="sub-g69" class="cap clip" data-start="273.59" data-duration="2.41"><span>sin iniciar sesión.</span></div>
<div id="sub-g70" class="cap clip" data-start="276.41" data-duration="2.43"><span>Ahí buscan un servicio o filtran por categoría,</span></div>
<div id="sub-g71" class="cap clip" data-start="278.86" data-duration="3.3"><span>y ven al instante su precio y su duración.</span></div>
<div id="sub-g72" class="cap clip" data-start="282.57" data-duration="1.82"><span>Al abrir un servicio ven su descripción,</span></div>
<div id="sub-g73" class="cap clip" data-start="284.41" data-duration="3.6"><span>y pueden elegirlo o consultarlo por WhatsApp.</span></div>
<div id="sub-g74" class="cap clip" data-start="288.42" data-duration="1.9"><span>Solo aparecen las promociones vigentes,</span></div>
<div id="sub-g75" class="cap clip" data-start="290.34" data-duration="3.47"><span>y tu clienta puede elegir una para su pedido.</span></div>
<div id="sub-g76" class="cap clip" data-start="294.23" data-duration="3.02"><span>Al elegir servicios se arma su pedido con el total estimado.</span></div>
<div id="sub-g77" class="cap clip" data-start="297.61" data-duration="2.85"><span>Con Coordinar por WhatsApp, el mensaje te llega ya escrito,</span></div>
<div id="sub-g78" class="cap clip" data-start="300.48" data-duration="2.77"><span>y tu equipo agenda la cita.</span></div>
<div id="sub-g79" class="cap clip" data-start="303.65" data-duration="1.54"><span>En la galería conocen tu local,</span></div>
<div id="sub-g80" class="cap clip" data-start="305.21" data-duration="2.33"><span>y con Cómo llegar abren tu ubicación en el mapa.</span></div>
<div id="sub-g81" class="cap clip" data-start="307.91" data-duration="3.92"><span>También te encuentran en Facebook, Instagram y WhatsApp.</span></div>
<div id="sub-g82" class="cap clip" data-start="312.24" data-duration="4.75"><span>Y como la mayoría entrará desde el celular, la página se adapta sola.</span></div>
<div id="sub-g83" class="cap clip" data-start="318.3" data-duration="2.26"><span>El sistema también va contigo en el celular.</span></div>
<div id="sub-g84" class="cap clip" data-start="320.92" data-duration="4.6"><span>Al entrar, te invita a instalarlo con el botón Instalar sistema.</span></div>
<div id="sub-g85" class="cap clip" data-start="325.93" data-duration="2.84"><span>En Android, pulsa Instalar sistema y confirma.</span></div>
<div id="sub-g86" class="cap clip" data-start="329.13" data-duration="4.21"><span>Si tu navegador no lo ofrece, sigue estos tres pasos.</span></div>
<div id="sub-g87" class="cap clip" data-start="333.75" data-duration="1.6"><span>En iPhone se hace desde Safari:</span></div>
<div id="sub-g88" class="cap clip" data-start="335.37" data-duration="4.45"><span>toca Compartir, luego Añadir a pantalla de inicio, y listo.</span></div>
<div id="sub-g89" class="cap clip" data-start="340.22" data-duration="2.62"><span>Queda anclado a tu pantalla de inicio como tuSpa Gestión,</span></div>
<div id="sub-g90" class="cap clip" data-start="342.86" data-duration="3.55"><span>y se abre a pantalla completa, como una app.</span></div>
<div id="sub-g91" class="cap clip" data-start="346.82" data-duration="3.54"><span>Abajo tienes tus accesos rápidos, y en el menú, todo lo demás.</span></div>
<div id="sub-g92" class="cap clip" data-start="350.73" data-duration="1.93"><span>Cada persona ve solo lo que le corresponde:</span></div>
<div id="sub-g93" class="cap clip" data-start="352.68" data-duration="3.71"><span>la especialista, por ejemplo, no ve la caja.</span></div>
<div id="sub-g94" class="cap clip" data-start="356.8" data-duration="4.55"><span>Revisa tu agenda, las citas del día y su detalle desde el teléfono.</span></div>
<div id="sub-g95" class="cap clip" data-start="361.76" data-duration="4.12"><span>Agenda nuevas citas y elige la hora con este reloj táctil.</span></div>
<div id="sub-g96" class="cap clip" data-start="366.3" data-duration="4.75"><span>Y registra clientas y cobra desde el celular, sin ir a la computadora.</span></div>
<div id="sub-g97" class="cap clip" data-start="372.36" data-duration="3.6"><span>¿Qué puede hacer cada usuario? El Administrador maneja todo:</span></div>
<div id="sub-g98" class="cap clip" data-start="375.98" data-duration="3.05"><span>el catálogo, el equipo, la caja y los reportes.</span></div>
<div id="sub-g99" class="cap clip" data-start="379.41" data-duration="2.86"><span>Recepción atiende la agenda, las clientas y la caja.</span></div>
<div id="sub-g100" class="cap clip" data-start="382.65" data-duration="3.94"><span>Y la Especialista se enfoca en sus citas y sus clientas.</span></div>
<div id="sub-g101" class="cap clip" data-start="388.2" data-duration="3.5"><span>Este es el resumen de permisos de cada rol.</span></div>
<div id="sub-g102" class="cap clip" data-start="393.01" data-duration="3.95"><span>¿Olvidaste tu contraseña? Pídele al Administrador que te asigne una nueva</span></div>
<div id="sub-g103" class="cap clip" data-start="396.98" data-duration="2.1"><span>desde Equipo.</span></div>
<div id="sub-g104" class="cap clip" data-start="399.49" data-duration="5.01"><span>Gracias por ver. tuSpa: tu negocio, en equilibrio.</span></div>
